[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspine"
version = "0.0.0"
description = "Python-first agent runtime contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
